<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Music · recordings</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #262a33; --text: #e8e9ec; --dim: #8b90a0;
    --accent: #ff5a5f; --ok: #4cc38a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f6f8; --card: #fff; --line: #e3e4e8; --text: #16181d; --dim: #6b7080; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .rec { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #name { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--bg); color: var(--text); font-size: 15px; }
  #btn { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--line);
         background: var(--card); display: grid; place-items: center; cursor: pointer;
         -webkit-tap-highlight-color: transparent; }
  #btn span { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); transition: all .15s; }
  #btn.on span { width: 34px; height: 34px; border-radius: 8px; }
  #btn.on { border-color: var(--accent); }
  #time { font: 600 28px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  #meter { width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .05s; }
  #status { color: var(--dim); font-size: 13px; min-height: 18px; text-align: center; }
  .row { display: flex; gap: 8px; width: 100%; }
  .ghost { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: none;
           color: var(--text); font-size: 14px; cursor: pointer; text-align: center; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 24px 4px 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { padding: 12px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .title { font-weight: 600; word-break: break-word; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .del { background: none; border: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 2px 4px; }
  audio { width: 100%; height: 36px; margin-top: 8px; }
  .empty { color: var(--dim); text-align: center; padding: 20px; }
</style>
</head>
<body>
<main>
  <h1>🎙️ Recordings</h1>

  <section class="card rec">
    <input id="name" placeholder="Name (optional), e.g. chorus idea" autocomplete="off">
    <button id="btn" aria-label="Record"><span></span></button>
    <div id="time">0:00</div>
    <div id="meter"><i></i></div>
    <div id="status">Tap to record</div>
    <div class="row">
      <label class="ghost">Upload a file<input id="file" type="file" accept="audio/*" multiple hidden></label>
    </div>
  </section>

  <h2>History</h2>
  <ul id="list"><li class="card empty">Loading…</li></ul>
</main>

<script>
const $ = (s) => document.querySelector(s);
const btn = $("#btn"), time = $("#time"), status = $("#status"), bar = $("#meter i");
let rec = null, chunks = [], started = 0, tick = null, stream = null, raf = null, ctx = null;

const MIME = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus", "audio/webm"]
  .find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";

const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const size = (b) => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e3) + " KB";
const when = (iso) => new Date(iso).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

async function start() {
  try {
    // Raw signal: no noise suppression or auto-gain, so pitch tracking gets the real voice.
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    status.textContent = "Microphone blocked: " + e.message; return;
  }
  chunks = [];
  rec = new MediaRecorder(stream, MIME ? { mimeType: MIME } : undefined);
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = finish;
  rec.start(1000);
  started = Date.now();
  btn.classList.add("on"); status.textContent = "Recording… tap to stop";
  tick = setInterval(() => time.textContent = fmt((Date.now() - started) / 1000), 250);
  meter();
  navigator.wakeLock?.request("screen").catch(() => {});
}

function meter() {
  ctx = new AudioContext();
  const an = ctx.createAnalyser(); an.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize);
  const loop = () => {
    an.getFloatTimeDomainData(buf);
    const rms = Math.sqrt(buf.reduce((a, v) => a + v * v, 0) / buf.length);
    bar.style.width = Math.min(100, rms * 400) + "%";
    raf = requestAnimationFrame(loop);
  };
  loop();
}

function stop() {
  rec.stop();
  stream.getTracks().forEach((t) => t.stop());
  clearInterval(tick); cancelAnimationFrame(raf); ctx?.close();
  bar.style.width = 0; btn.classList.remove("on");
}

async function finish() {
  const duration = (Date.now() - started) / 1000;
  const blob = new Blob(chunks, { type: (rec.mimeType || MIME || "audio/webm").split(";")[0] });
  await upload(blob, { name: $("#name").value.trim() || "hum", duration, source: "mic" });
  $("#name").value = ""; time.textContent = "0:00";
}

async function upload(blob, { name, duration, source, filename = "" }) {
  status.textContent = `Saving ${name}…`;
  const q = new URLSearchParams({ name, source, filename });
  if (duration) q.set("duration", duration.toFixed(1));
  try {
    const r = await fetch("api/upload?" + q, { method: "POST", body: blob,
      headers: { "Content-Type": blob.type || "application/octet-stream" } });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    status.textContent = `Saved ✓ ${name}`;
    load();
  } catch (e) {
    status.textContent = "Upload failed: " + e.message + " (tap record again to retry)";
  }
}

const probe = (file) => new Promise((res) => {
  const a = new Audio(); a.preload = "metadata";
  a.onloadedmetadata = () => { res(isFinite(a.duration) ? a.duration : null); URL.revokeObjectURL(a.src); };
  a.onerror = () => res(null);
  a.src = URL.createObjectURL(file);
});

$("#file").onchange = async (e) => {
  for (const f of e.target.files) {
    const name = $("#name").value.trim() || f.name.replace(/\.[^.]+$/, "");
    await upload(f, { name, duration: await probe(f), source: "file", filename: f.name });
  }
  e.target.value = ""; $("#name").value = "";
};

btn.onclick = () => rec && rec.state === "recording" ? stop() : start();

async function load() {
  const files = await (await fetch("api/files")).json();
  const ul = $("#list"); ul.innerHTML = "";
  if (!files.length) { ul.innerHTML = '<li class="card empty">No recordings yet</li>'; return; }
  for (const f of files) {
    const li = document.createElement("li"); li.className = "card";
    li.innerHTML = `<div class="top"><div><div class="title"></div><div class="meta"></div></div>
      <button class="del">Delete</button></div><audio controls preload="none"></audio>`;
    li.querySelector(".title").textContent = ({ mic: "🎙️ ", claude: "🎹 " }[f.source] || "📁 ") + f.name;
    li.querySelector(".meta").textContent =
      [when(f.created), f.duration ? fmt(f.duration) : null, size(f.size), f.file].filter(Boolean).join(" · ");
    if (f.notes) {
      const d = document.createElement("div"); d.className = "meta";
      d.textContent = `Heard: ${f.notes}` + (f.key ? ` · ${f.key}` : "") + (f.chords ? ` · chords ${f.chords}` : "");
      li.querySelector(".top > div").appendChild(d);
    }
    li.querySelector("audio").src = "files/" + encodeURIComponent(f.file);
    li.querySelector(".del").onclick = async () => {
      if (!confirm(`Delete "${f.name}"?`)) return;
      await fetch("api/files/" + encodeURIComponent(f.file), { method: "DELETE" });
      load();
    };
    ul.appendChild(li);
  }
}

if (!window.MediaRecorder) status.textContent = "This browser can't record. Use Chrome, or upload a file.";
load();
</script>
</body>
</html>
